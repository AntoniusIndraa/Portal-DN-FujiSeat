<style>
  :root {
    --navy: #0f172a;
    --navy-surface: #1e293b;
    --steel: #334155;
    --red: #dc2626;
    --red-dark: #b91c1c;
    --green: #16a34a;
    --green-bg: #dc26260d;
    --green-light: #f0fdf4;
    --green-text: #15803d;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --amber-text: #b45309;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #dn-root {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #dn-root button { font-family: inherit; cursor: pointer; border: none; }
  #dn-root input, #dn-root select { font-family: inherit; }
  #dn-root a { color: inherit; text-decoration: none; }
  #dn-root :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---------- Login View ---------- */
  .dn-login-wrap {
    display: flex;
    min-height: 100vh;
    width: 100%;
  }
  .dn-login-side {
    flex: 1.1;
    background: linear-gradient(135deg, var(--navy) 0%, #1e293b 100%);
    color: #fff;
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .dn-login-side svg.dn-route {
    position: absolute; right: -40px; bottom: -30px; opacity: 0.12; width: 380px; height: 380px;
  }
  .dn-brand-mark {
    display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 15px; letter-spacing: 0.5px;
  }
  .dn-brand-mark .dn-logo-img {
    height: 36px; width: auto; object-fit: contain; background: #fff; padding: 4px 8px; border-radius: 6px;
  }
  .dn-login-headline { max-width: 440px; position: relative; z-index: 1; margin: auto 0; }
  .dn-login-headline h1 { font-size: 32px; line-height: 1.25; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
  .dn-login-headline p { color: #94a3b8; font-size: 15px; }
  .dn-login-foot { color: #64748b; font-size: 13px; position: relative; z-index: 1; }

  .dn-login-form-col {
    flex: 1;
    display: flex; align-items: center; justify-content: center; padding: 32px 24px; background: var(--surface);
  }
  .dn-login-card { width: 100%; max-width: 360px; }
  .dn-login-card h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700; color: var(--navy); }
  .dn-login-card p.dn-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  
  .dn-field { margin-bottom: 18px; }
  .dn-field label { display: block; font-size: 13px; font-weight: 600; color: var(--steel); margin-bottom: 6px; }
  .dn-field input, .dn-field select {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff;
    transition: all 0.2s ease;
  }
  .dn-field input:focus, .dn-field select:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
  
  .dn-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
    transition: all 0.2s ease; cursor: pointer;
  }
  .dn-btn:active { transform: scale(0.98); }
  .dn-btn-primary { background: var(--red); color: #fff; width: 100%; }
  .dn-btn-primary:hover { background: var(--red-dark); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25); }
  .dn-btn-secondary { background: var(--navy); color: #fff; }
  .dn-btn-secondary:hover { background: var(--navy-surface); }
  .dn-btn-ghost { background: transparent; color: var(--text-muted); border: 1.5px solid var(--border); }
  .dn-btn-ghost:hover { border-color: var(--steel); color: var(--navy); background: #f1f5f9; }
  .dn-btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 6px; }

  .dn-error {
    background: #fef2f2; color: var(--red-dark); font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px;
    border: 1px solid #fecaca; display: flex; align-items: center; gap: 8px;
  }

  /* Responsive Login */
  @media (max-width: 860px) {
    .dn-login-wrap { flex-direction: column; }
    .dn-login-side { display: none; }
    .dn-login-form-col { min-height: 100vh; }
  }

  /* ---------- Shell Topbar & Layout ---------- */
  .dn-topbar {
    background: var(--navy); color: #fff; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    position: sticky; top: 0; z-index: 40; box-shadow: var(--shadow-md);
  }
  .dn-topbar-left { display: flex; align-items: center; gap: 12px; }
  .dn-topbar-left img { height: 28px; width: auto; background: #fff; padding: 2px 6px; border-radius: 4px; }
  .dn-topbar-title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
  .dn-topbar-title span { display: block; font-size: 11px; font-weight: 400; color: #94a3b8; }
  .dn-topbar-right { display: flex; align-items: center; gap: 16px; }
  .dn-user-chip { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .dn-user-chip .dn-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--steel); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  .dn-role-tag { font-size: 10px; background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
  .dn-logout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .dn-logout-btn:hover { background: rgba(255,255,255,0.2); }

  /* ---------- Admin Layout with Sidebar ---------- */
  .dn-admin-layout {
    display: flex;
    min-height: calc(100vh - 57px);
  }
  .dn-sidebar {
    width: 250px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    flex-shrink: 0;
  }
  .dn-sidebar-menu { display: flex; flex-direction: column; gap: 6px; list-style: none; }
  .dn-sidebar-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px;
    color: var(--text-muted); font-weight: 600; font-size: 13.5px; cursor: pointer; transition: all 0.15s ease;
  }
  .dn-sidebar-item:hover { background: #f1f5f9; color: var(--navy); }
  .dn-sidebar-item.active { background: var(--navy); color: #fff; }
  .dn-sidebar-item.active svg { stroke: #fff; }

  .dn-main-content {
    flex: 1;
    padding: 28px 32px;
    max-width: 1200px;
    width: 100%;
  }

  /* Responsive Admin Sidebar */
  @media (max-width: 860px) {
    .dn-admin-layout { flex-direction: column; }
    .dn-sidebar {
      width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 16px;
    }
    .dn-sidebar-menu { flex-direction: row; justify-content: center; }
    .dn-sidebar-item { flex: 1; justify-content: center; padding: 10px; font-size: 12.5px; text-align: center; }
    .dn-main-content { padding: 20px 16px; }
  }

  /* ---------- Dashboard UI Components ---------- */
  .dn-page-head {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
  }
  .dn-page-head h1 { font-size: 22px; font-weight: 700; color: var(--navy); }
  .dn-page-head p { color: var(--text-muted); font-size: 13.5px; margin-top: 2px; }

  .dn-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .dn-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
    box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;
  }
  .dn-stat .dn-stat-num { font-size: 28px; font-weight: 800; color: var(--navy); line-height: 1.1; }
  .dn-stat .dn-stat-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-top: 6px; }
  .dn-stat.dn-stat-amber .dn-stat-num { color: var(--amber); }
  .dn-stat.dn-stat-green .dn-stat-num { color: var(--green); }

  .dn-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px;
    box-shadow: var(--shadow-sm); margin-bottom: 24px;
  }
  .dn-card h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .dn-card p.dn-card-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }

  /* Drag Drop Zone */
  .dn-file-drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 24px 16px; text-align: center;
    font-size: 13px; color: var(--text-muted); background: #fafafa; transition: all 0.2s ease; cursor: pointer;
  }
  .dn-file-drop:hover { border-color: var(--navy); background: #f1f5f9; }
  .dn-file-drop input[type=file] { margin-top: 10px; font-size: 12.5px; width: 100%; max-width: 280px; }

  /* Tables */
  .dn-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table.dn-table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
  table.dn-table th {
    background: #f8fafc; color: var(--steel); font-weight: 650; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.dn-table td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.dn-table tr:last-child td { border-bottom: none; }
  table.dn-table tr:hover td { background: #f8fafc; }

  .dn-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .dn-badge-green { background: var(--green-light); color: var(--green-text); border: 1px solid #bbf7d0; }
  .dn-badge-amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid #fde68a; }

  .dn-icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px;
    background: transparent; color: var(--text-muted); transition: all 0.15s ease;
  }
  .dn-icon-btn:hover { background: #fee2e2; color: var(--red-dark); }

  /* Pending Panel */
  .dn-pending-panel { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .dn-pending-panel h3 { color: var(--amber-text); font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .dn-pending-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #fef3c7; flex-wrap: wrap; }
  .dn-pending-row:last-of-type { border-bottom: none; }
  .dn-pending-file { font-weight: 600; font-size: 13px; flex: 1 1 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Supplier Dashboard (No Sidebar) ---------- */
  .dn-supplier-layout { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
  .dn-supplier-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px;
    box-shadow: var(--shadow-sm); transition: all 0.2s ease; flex-wrap: wrap;
  }
  .dn-supplier-card:hover { border-color: var(--navy); box-shadow: var(--shadow-md); }
  .dn-supplier-card.dn-downloaded { border-left: 4px solid var(--green); }
  .dn-supplier-card.dn-pending { border-left: 4px solid var(--amber); }
  .dn-sf-name { font-weight: 700; font-size: 15px; color: var(--navy); margin-bottom: 4px; }
  .dn-sf-meta { font-size: 12.5px; color: var(--text-muted); }

  .dn-toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--navy); color: #fff;
    padding: 12px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
    box-shadow: var(--shadow-lg); z-index: 100; display: flex; align-items: center; gap: 10px; animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .dn-empty { padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 14px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
  .dn-empty b { display: block; color: var(--navy); font-size: 16px; margin-bottom: 6px; font-weight: 700; }
</style>

<div id="dn-root"></div>

<script>
(function(){
  const root = document.getElementById('dn-root');
  let session = null;
  let usersCache = [];
  let filesCache = [];
  let pendingUploads = [];
  let notice = null;
  let toast = null;
  let adminActiveTab = 'dashboard'; // 'dashboard' | 'suppliers'

  const ICONS = {
    upload:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
    download:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    logout:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
    file:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
    refresh:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
    users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    dashboard:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>'
  };

  const API_URL = 'https://script.google.com/macros/s/AKfycbzgsAi_xzr7H32Hf-5WMJlEX3ijikmjeMcB2cfpL_ZXTmoF-ulWqOZHAKBIhOrXlFfH/exec';
  const MAX_PDF_BYTES = 8 * 1024 * 1024;

  async function apiCall(action, payload){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {} }),
    });
    if(!res.ok) throw new Error('Server error (' + res.status + ')');
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Terjadi kesalahan.');
    return json.data;
  }

  async function loadUsers(){
    try { usersCache = await apiCall('getUsers', {}); }
    catch(e){ usersCache = []; notice = {type:'error', msg:'Gagal memuat pengguna: ' + e.message}; }
  }
  async function loadFiles(){
    try {
      const payload = (session && session.role==='supplier') ? {supplierUsername: session.username} : {};
      filesCache = await apiCall('getFiles', payload);
    } catch(e){ filesCache = []; notice = {type:'error', msg:'Gagal memuat file: ' + e.message}; }
  }

  function fmtDate(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' +
           d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDateOnly(isoDate){
    if(!isoDate) return '-';
    const d = new Date(isoDate + 'T00:00:00');
    if(isNaN(d)) return '-';
    return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
  }

  function parseDnFilename(name){
    const base = name.replace(/\.pdf$/i, '').trim();
    const parts = base.split('_');
    if(parts.length >= 2){
      const last = parts[parts.length - 1];
      if(/^\d{8}$/.test(last)){
        const y = last.slice(0,4), m = last.slice(4,6), d = last.slice(6,8);
        return { supplierRaw: parts.slice(0, -1).join(' '), dateIso: `${y}-${m}-${d}` };
      }
    }
    return { supplierRaw: base.replace(/_/g, ' '), dateIso: null };
  }
  function normalizeSupplierName(s){
    return (s || '').toLowerCase().replace(/\b(pt|cv|ud|tbk|persero)\b/g, '').replace(/[^a-z0-9]/g, '');
  }
  function matchSupplierByName(supplierRaw, suppliers){
    const norm = normalizeSupplierName(supplierRaw);
    if(!norm) return null;
    let found = suppliers.find(s => normalizeSupplierName(s.name) === norm);
    if(!found) found = suppliers.find(s => {
      const sn = normalizeSupplierName(s.name);
      return sn && (sn.includes(norm) || norm.includes(sn));
    });
    return found || null;
  }
  function readFileAsDataUrl(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  function initials(name){ return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function showToast(msg){
    toast = msg; render();
    setTimeout(()=>{ toast=null; render(); }, 2600);
  }

  /* ---------- RENDER LOGIN ---------- */
  function renderLogin(){
    root.innerHTML = `
      <div class="dn-login-wrap">
        <div class="dn-login-side">
          <div class="dn-brand-mark">
            <img src="logo-fujiseat.png" alt="Logo Fuji Seat" class="dn-logo-img" onerror="this.style.display='none'" />
            PORTAL DN &middot; FUJI SEAT INDONESIA
          </div>
          <div class="dn-login-headline">
            <h1>Satu tempat untuk semua Delivery Note supplier.</h1>
            <p>Sistem manajemen dan pendistribusian dokumen pengiriman resmi.</p>
          </div>
          <div class="dn-login-foot">&copy; 2026 PT Fuji Seat Indonesia &middot; Akses terenkripsi</div>
        </div>
        <div class="dn-login-form-col">
          <div class="dn-login-card">
            <h2>Masuk ke Portal</h2>
            <p class="dn-sub">Gunakan akun yang diberikan oleh admin PPIC.</p>
            ${notice ? `<div class="dn-error">${notice.msg}</div>` : ''}
            <form id="dn-login-form">
              <div class="dn-field">
                <label for="dn-lu">Username</label>
                <input id="dn-lu" name="u" autocomplete="username" placeholder="Masukkan username" required />
              </div>
              <div class="dn-field">
                <label for="dn-lp">Password</label>
                <input id="dn-lp" name="p" type="password" autocomplete="current-password" placeholder="••••••••" required />
              </div>
              <button type="submit" class="dn-btn dn-btn-primary">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    `;
    document.getElementById('dn-login-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const u = document.getElementById('dn-lu').value.trim();
      const p = document.getElementById('dn-lp').value;
      try{
        const found = await apiCall('login', {username:u, password:p});
        notice = null;
        session = found;
        sessionStorage.setItem('dnportal_session', JSON.stringify(session));
        if(session.role === 'admin'){ await Promise.all([loadUsers(), loadFiles()]); }
        else { await loadFiles(); }
        render();
      }catch(err){
        notice = {type:'error', msg: err.message};
        render();
      }
    });
  }

  /* ---------- TOPBAR ---------- */
  function topbar(){
    return `
      <div class="dn-topbar">
        <div class="dn-topbar-left">
          <img src="logo-fujiseat.png" alt="Fuji Seat" onerror="this.style.display='none'" />
          <div class="dn-topbar-title">Portal DN Supplier<span>PT Fuji Seat Indonesia</span></div>
        </div>
        <div class="dn-topbar-right">
          <div class="dn-user-chip">
            <div class="dn-avatar">${initials(session.name)}</div>
            <span style="font-weight:600">${session.name}</span>
            <span class="dn-role-tag">${session.role==='admin'?'Admin':'Supplier'}</span>
          </div>
          <button class="dn-logout-btn" id="dn-logout">${ICONS.logout} Keluar</button>
        </div>
      </div>
    `;
  }

  function bindTopbar(){
    document.getElementById('dn-logout').addEventListener('click', ()=>{
      session = null; notice = null;
      sessionStorage.removeItem('dnportal_session');
      render();
    });
  }

  /* ---------- RENDER ADMIN (WITH SIDEBAR) ---------- */
  function renderAdmin(){
    const suppliers = usersCache.filter(u=>u.role==='supplier');
    const total = filesCache.length;
    const downloaded = filesCache.filter(f=>f.downloaded).length;
    const pending = total - downloaded;

    const fileRows = filesCache.slice().sort((a,b)=> new Date(b.uploadedAt)-new Date(a.uploadedAt)).map(f=>`
      <tr>
        <td style="font-weight:600">${f.supplierName}</td>
        <td><span style="display:inline-flex;align-items:center;gap:6px">${ICONS.file} ${f.fileName}</span></td>
        <td>${fmtDateOnly(f.dnDate)}</td>
        <td>${fmtDate(f.uploadedAt)}</td>
        <td>${f.downloaded
            ? `<span class="dn-badge dn-badge-green">${ICONS.check} Sudah diunduh (${fmtDate(f.downloadedAt)})</span>`
            : `<span class="dn-badge dn-badge-amber">${ICONS.clock} Menunggu diunduh</span>`}</td>
        <td><button class="dn-icon-btn" data-delete-file="${f.id}" title="Hapus file">${ICONS.trash}</button></td>
      </tr>
    `).join('');

    const pendingRows = pendingUploads.map(p => `
      <div class="dn-pending-row">
        <div class="dn-pending-file">${ICONS.file} ${p.fileName}</div>
        <div style="flex: 1 1 180px">
          ${p.autoMatched
            ? `<span class="dn-badge dn-badge-green">${ICONS.check}${p.supplierName}</span>`
            : `<select data-supplier-for="${p.tempId}" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border)">
                 <option value="" ${!p.supplierUsername ? 'selected':''} disabled>Pilih Supplier...</option>
                 ${suppliers.map(s=>`<option value="${s.username}" ${p.supplierUsername===s.username?'selected':''}>${s.name}</option>`).join('')}
               </select>`}
        </div>
        <div style="flex: 0 0 140px">
          <input type="date" value="${p.dnDate || ''}" data-date-for="${p.tempId}" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border)" />
        </div>
        <button class="dn-icon-btn" data-remove="${p.tempId}" title="Batalkan">✕</button>
      </div>
    `).join('');

    // Dashboard Content
    const dashboardHtml = `
      <div class="dn-page-head">
        <div>
          <h1>Dashboard Admin</h1>
          <p>Kelola unggahan berkas Delivery Note dan pantau status pengunduhannya.</p>
        </div>
        <button class="dn-btn dn-btn-ghost dn-btn-sm" id="dn-refresh-btn">${ICONS.refresh} Refresh Data</button>
      </div>

      <div class="dn-stat-row">
        <div class="dn-stat">
          <div class="dn-stat-num">${total}</div>
          <div class="dn-stat-label">Total Berkas Diunggah</div>
        </div>
        <div class="dn-stat dn-stat-amber">
          <div class="dn-stat-num">${pending}</div>
          <div class="dn-stat-label">Menunggu Diunduh</div>
        </div>
        <div class="dn-stat dn-stat-green">
          <div class="dn-stat-num">${downloaded}</div>
          <div class="dn-stat-label">Sudah Diunduh</div>
        </div>
      </div>

      <div class="dn-card">
        <h3>Unggah Dokumen DN (Batch Upload & Auto-Parsing)</h3>
        <p class="dn-card-sub">Pilih satu atau beberapa berkas PDF sekaligus. Nama supplier dan tanggal DN dideteksi otomatis jika format nama berkas: <b>NamaSupplier_YYYYMMDD.pdf</b></p>
        <div class="dn-file-drop" onclick="document.getElementById('dn-up-files').click()">
          <div><b>Klik atau tarik berkas PDF ke sini</b></div>
          <div style="font-size:12px;margin-top:4px;color:var(--text-muted)">Mendukung upload banyak file sekaligus (Maks 8MB/file)</div>
          <input type="file" id="dn-up-files" accept="application/pdf" multiple style="display:none" />
        </div>
      </div>

      ${pendingUploads.length > 0 ? `
        <div class="dn-pending-panel">
          <h3>Konfirmasi Data Manual (${pendingUploads.length} Berkas)</h3>
          <p style="font-size:13px;color:var(--amber-text);margin-bottom:12px">Beberapa berkas tidak sesuai format otomatis. Mohon lengkapi nama supplier & tanggal DN manual.</p>
          ${pendingRows}
          <div style="display:flex;gap:10px;margin-top:16px">
            <button class="dn-btn dn-btn-secondary dn-btn-sm" id="dn-confirm-upload">${ICONS.upload} Simpan Semua Berkas</button>
            <button class="dn-btn dn-btn-ghost dn-btn-sm" id="dn-cancel-upload">Batalkan</button>
          </div>
        </div>
      ` : ''}

      <div class="dn-card">
        <h3>Riwayat & Status Berkas</h3>
        <p class="dn-card-sub">Daftar seluruh berkas Delivery Note yang telah terdaftar di sistem.</p>
        ${total === 0 ? `
          <div class="dn-empty"><b>Belum Ada Berkas DN</b>Silakan unggah dokumen pertama Anda di atas.</div>
        ` : `
          <div class="dn-table-wrap">
            <table class="dn-table">
              <thead>
                <tr>
                  <th>Supplier</th>
                  <th>Nama Berkas</th>
                  <th>Tanggal DN</th>
                  <th>Waktu Unggah</th>
                  <th>Status Pengunduhan</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>${fileRows}</tbody>
            </table>
          </div>
        `}
      </div>
    `;

    // Kelola Supplier Content
    const suppliersHtml = `
      <div class="dn-page-head">
        <div>
          <h1>Kelola Supplier</h1>
          <p>Manajemen akun supplier terdaftar untuk akses portal Delivery Note.</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));gap:24px">
        <div class="dn-card" style="height:fit-content">
          <h3>Tambah Akun Supplier Baru</h3>
          <p class="dn-card-sub">Buat kredensial login baru untuk perusahaan supplier.</p>
          <form id="dn-add-supplier-form">
            <div class="dn-field">
              <label for="dn-as-name">Nama Perusahaan</label>
              <input id="dn-as-name" required placeholder="mis. PT Karya Logam" />
            </div>
            <div class="dn-field">
              <label for="dn-as-user">Username Login</label>
              <input id="dn-as-user" required placeholder="mis. karyalogam" />
            </div>
            <div class="dn-field">
              <label for="dn-as-pass">Password</label>
              <input id="dn-as-pass" required placeholder="Minimal 4 karakter" />
            </div>
            <button type="submit" class="dn-btn dn-btn-primary">${ICONS.plus} Buat Akun Supplier</button>
          </form>
        </div>

        <div class="dn-card">
          <h3>Daftar Supplier Terdaftar</h3>
          <p class="dn-card-sub">Total ${suppliers.length} supplier aktif di dalam sistem.</p>
          ${suppliers.length === 0 ? `
            <div class="dn-empty">Belum ada akun supplier.</div>
          ` : `
            <div class="dn-table-wrap">
              <table class="dn-table">
                <thead>
                  <tr>
                    <th>Nama Perusahaan</th>
                    <th>Username</th>
                  </tr>
                </thead>
                <tbody>
                  ${suppliers.map(s=>`
                    <tr>
                      <td style="font-weight:600">${s.name}</td>
                      <td><code>${s.username}</code></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      </div>
    `;

    root.innerHTML = `
      ${topbar()}
      <div class="dn-admin-layout">
        <div class="dn-sidebar">
          <ul class="dn-sidebar-menu">
            <li class="dn-sidebar-item ${adminActiveTab==='dashboard'?'active':''}" id="nav-dashboard">
              ${ICONS.dashboard} Dashboard Admin
            </li>
            <li class="dn-sidebar-item ${adminActiveTab==='suppliers'?'active':''}" id="nav-suppliers">
              ${ICONS.users} Kelola Supplier
            </li>
          </ul>
        </div>
        <div class="dn-main-content">
          ${notice ? `<div class="dn-error">${notice.msg}</div>` : ''}
          ${adminActiveTab === 'dashboard' ? dashboardHtml : suppliersHtml}
        </div>
      </div>
      ${toast ? `<div class="dn-toast">${ICONS.check}${toast}</div>` : ''}
    `;

    bindTopbar();

    // Navigation Switcher
    document.getElementById('nav-dashboard').addEventListener('click', ()=>{ adminActiveTab='dashboard'; render(); });
    document.getElementById('nav-suppliers').addEventListener('click', ()=>{ adminActiveTab='suppliers'; render(); });

    // Refresh Button
    const refBtn = document.getElementById('dn-refresh-btn');
    if(refBtn){
      refBtn.addEventListener('click', async ()=>{
        refBtn.disabled = true;
        await loadFiles();
        showToast('Data berhasil diperbarui');
      });
    }

    // Event File Upload & Handling
    const fileInp = document.getElementById('dn-up-files');
    if(fileInp){
      fileInp.addEventListener('change', async (e)=>{
        const files = Array.from(e.target.files || []);
        if(!files.length) return;
        let skipped = null;
        const autoItems = [];
        for(const file of files){
          const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
          if(!isPdf){ skipped = `Berkas "${file.name}" dilewati (bukan PDF).`; continue; }
          if(file.size > MAX_PDF_BYTES){ skipped = `Berkas "${file.name}" dilewati (melebihi 8MB).`; continue; }
          const dataUrl = await readFileAsDataUrl(file);
          const { supplierRaw, dateIso } = parseDnFilename(file.name);
          const matched = matchSupplierByName(supplierRaw, suppliers);
          const entry = {
            tempId: 't' + Date.now() + Math.random().toString(16).slice(2),
            fileName: file.name,
            dataUrl,
            supplierUsername: matched ? matched.username : '',
            supplierName: matched ? matched.name : '',
            dnDate: dateIso || '',
            autoMatched: !!matched,
          };
          if(matched && dateIso){ autoItems.push(entry); }
          else { pendingUploads.push(entry); }
        }
        notice = skipped ? {type:'error', msg: skipped} : null;
        render();

        if(autoItems.length){
          try{
            await apiCall('addFiles', { items: autoItems.map(p=>({
              supplierUsername: p.supplierUsername,
              supplierName: p.supplierName,
              fileName: p.fileName,
              dnDate: p.dnDate,
              dataUrl: p.dataUrl,
            })) });
            await loadFiles();
            showToast(autoItems.length + ' berkas berhasil diunggah');
          }catch(err){
            notice = {type:'error', msg:'Gagal menyimpan otomatis: ' + err.message};
            render();
          }
        }
      });
    }

    // Pending Confirmations
    const confirmBtn = document.getElementById('dn-confirm-upload');
    if(confirmBtn){
      confirmBtn.addEventListener('click', async ()=>{
        const incomplete = pendingUploads.filter(p => !p.supplierUsername || !p.dnDate);
        if(incomplete.length){
          notice = {type:'error', msg:'Lengkapi nama supplier dan tanggal DN untuk seluruh berkas manual.'};
          render(); return;
        }
        const items = pendingUploads.map(p=>{
          const supplier = usersCache.find(u=>u.username===p.supplierUsername);
          return {
            supplierUsername: p.supplierUsername,
            supplierName: supplier ? supplier.name : p.supplierName,
            fileName: p.fileName,
            dnDate: p.dnDate,
            dataUrl: p.dataUrl,
          };
        });
        confirmBtn.disabled = true;
        try{
          await apiCall('addFiles', {items});
          pendingUploads = [];
          notice = null;
          await loadFiles();
          showToast(items.length + ' berkas berhasil disimpan');
        }catch(err){
          notice = {type:'error', msg:'Gagal menyimpan berkas: ' + err.message};
          render();
        }
      });
    }

    const cancelBtn = document.getElementById('dn-cancel-upload');
    if(cancelBtn){
      cancelBtn.addEventListener('click', ()=>{ pendingUploads = []; notice = null; render(); });
    }

    // Bind inputs on pending
    root.querySelectorAll('[data-supplier-for]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const item = pendingUploads.find(p=>p.tempId===sel.getAttribute('data-supplier-for'));
        if(item){
          item.supplierUsername = sel.value;
          const su = usersCache.find(u=>u.username===sel.value);
          item.supplierName = su ? su.name : '';
        }
      });
    });
    root.querySelectorAll('[data-date-for]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const item = pendingUploads.find(p=>p.tempId===inp.getAttribute('data-date-for'));
        if(item) item.dnDate = inp.value;
      });
    });
    root.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        pendingUploads = pendingUploads.filter(p=>p.tempId!==btn.getAttribute('data-remove'));
        render();
      });
    });
    root.querySelectorAll('[data-delete-file]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.getAttribute('data-delete-file');
        const f = filesCache.find(x=>x.id===id);
        if(!f) return;
        if(!confirm(`Hapus berkas "${f.fileName}" milik ${f.supplierName}?`)) return;
        btn.disabled = true;
        try{
          await apiCall('deleteFile', {id});
          await loadFiles();
          showToast('Berkas berhasil dihapus');
        }catch(err){
          notice = {type:'error', msg:'Gagal menghapus berkas: ' + err.message};
          render();
        }
      });
    });

    // Form Add Supplier
    const addSuppForm = document.getElementById('dn-add-supplier-form');
    if(addSuppForm){
      addSuppForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const name = document.getElementById('dn-as-name').value.trim();
        const uname = document.getElementById('dn-as-user').value.trim();
        const pass = document.getElementById('dn-as-pass').value;
        if(usersCache.find(u=>u.username===uname)){
          notice = {type:'error', msg:'Username tersebut sudah digunakan.'}; render(); return;
        }
        try{
          await apiCall('addUser', {username:uname, password:pass, role:'supplier', name});
          notice = null;
          await loadUsers();
          showToast('Supplier ' + name + ' berhasil ditambahkan');
        }catch(err){
          notice = {type:'error', msg:'Gagal membuat akun: ' + err.message}; render();
        }
      });
    }
  }

  /* ---------- RENDER SUPPLIER (NO SIDEBAR) ---------- */
  function renderSupplier(){
    const mine = filesCache.filter(f=>f.supplierUsername===session.username)
                           .sort((a,b)=> new Date(b.uploadedAt)-new Date(a.uploadedAt));
    root.innerHTML = `
      ${topbar()}
      <div class="dn-supplier-layout">
        <div class="dn-page-head">
          <div>
            <h1>Dashboard Supplier</h1>
            <p>Daftar dokumen Delivery Note resmi yang ditujukan khusus untuk perusahaan Anda.</p>
          </div>
          <button class="dn-btn dn-btn-ghost dn-btn-sm" id="dn-refresh-supplier">${ICONS.refresh} Refresh</button>
        </div>

        ${notice ? `<div class="dn-error">${notice.msg}</div>` : ''}

        ${mine.length === 0 ? `
          <div class="dn-empty">
            <b>Belum Ada Dokumen DN Tersedia</b>
            Admin PPIC belum mengunggah dokumen Delivery Note untuk Anda.
          </div>
        ` : mine.map(f=>`
          <div class="dn-supplier-card ${f.downloaded ? 'dn-downloaded' : 'dn-pending'}">
            <div>
              <div class="dn-sf-name">${ICONS.file}${f.fileName}</div>
              <div class="dn-sf-meta">
                Tanggal DN: <b>${fmtDateOnly(f.dnDate)}</b> &middot; Diunggah: ${fmtDate(f.uploadedAt)}${f.downloaded ? `<br><span style="color:var(--green-text)">✓ Diunduh pada: ${fmtDate(f.downloadedAt)}</span>` : ''}
              </div>
            </div>
            <button class="dn-btn ${f.downloaded ? 'dn-btn-ghost' : 'dn-btn-secondary'}" data-download-id="${f.id}">
              ${ICONS.download}${f.downloaded ? 'Unduh Ulang' : 'Unduh PDF'}
            </button>
          </div>
        `).join('')}
      </div>
      ${toast ? `<div class="dn-toast">${ICONS.check}${toast}</div>` : ''}
    `;

    bindTopbar();

    const refBtn = document.getElementById('dn-refresh-supplier');
    if(refBtn){
      refBtn.addEventListener('click', async ()=>{
        await loadFiles();
        showToast('Daftar berkas diperbarui');
      });
    }

    root.querySelectorAll('[data-download-id]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.getAttribute('data-download-id');
        const f = filesCache.find(x=>x.id===id);
        if(!f) return;
        btn.disabled = true;
        try{
          const { fileName, dataUrl } = await apiCall('downloadFile', {id});
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          if(!f.downloaded){
            await apiCall('markDownloaded', {id});
          }
          showToast('Mengunduh ' + fileName);
          await loadFiles();
          render();
        }catch(err){
          notice = {type:'error', msg:'Gagal mengunduh: ' + err.message};
          btn.disabled = false;
          render();
        }
      });
    });
  }

  /* ---------- MAIN RENDER CONTROLLER ---------- */
  function render(){
    if(!session){ renderLogin(); return; }
    if(session.role === 'admin'){ renderAdmin(); }
    else { renderSupplier(); }
  }

  (async function init(){
    root.innerHTML = '<div style="padding:48px;text-align:center;color:#64748b;font-family:sans-serif;">Memuat Portal Delivery Note…</div>';
    try {
      const saved = sessionStorage.getItem('dnportal_session');
      if(saved) session = JSON.parse(saved);
    } catch(e){ session = null; }

    if(session && session.role === 'admin'){
      await Promise.all([loadUsers(), loadFiles()]);
    } else if(session){
      await loadFiles();
    }
    render();
  })();
})();
</script>
